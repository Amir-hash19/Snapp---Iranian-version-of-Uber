

services:
  db:
    container_name: db-snapp
    image: postgres:15   
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    restart: always
    command: postgres -c log_directory=/var/log/postgresql
    expose:
      - 5432

  backend:
    container_name: backend-snapp
    working_dir: /usr/src/app/
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - .:/usr/src/app 
    command: python app/manage.py runserver 0.0.0.0:8000
    ports:
      - 8000:8000  
    environment:
      - DEBUG=True
    env_file:
      - .env  
    restart: always
    depends_on: 
      - db
    dns:
      - 8.8.8.8
      - 8.8.4.4  

volumes:
  postgres_data: